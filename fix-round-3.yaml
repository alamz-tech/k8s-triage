---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-web
  namespace: round-3
  labels:
    app: reports-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports-web
  template:
    metadata:
      labels:
        app: reports-web
    spec:
      containers:
        - name: reports-web
          image: nginx:1.27.0-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
