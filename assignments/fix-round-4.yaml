---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-batch
  namespace: round-4
  labels:
    app: reports-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports-batch
  template:
    metadata:
      labels:
        app: reports-batch
    spec:
      containers:
        - name: reports-batch
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Batch report generation started..."
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
