---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: round-5
  labels:
    app: image-resizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      containers:
        - name: image-resizer
          image: polinux/stress:latest
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            limits:
              memory: "256Mi"
            requests:
              memory: "256Mi"
              cpu: "100m"
