# ==============================================================================
# ASSIGNMENT: Round 5
#
# Symptom:
# The pod terminates repeatedly with exit code 137.
#
# Your assignment:
# 1. Identify the failure layer (image, container, networking, scheduling, resources).
# 2. Find the root cause.
# 3. Apply a fix so the workload runs continuously without terminating.
#
# Hint:
# Inspect the container termination state and memory limits using kubectl describe pod.
# ==============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: round-5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: round-5
  labels:
    app: image-resizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      containers:
        - name: image-resizer
          image: polinux/stress:latest
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            limits:
              memory: "50Mi"
            requests:
              memory: "50Mi"
              cpu: "100m"
