# ==============================================================================
# ASSIGNMENT: Round 4
#
# Symptom:
# The pod stays in Pending status forever with 0 restarts.
#
# Your assignment:
# 1. Identify the failure layer (image, container, networking, scheduling, resources).
# 2. Find the root cause.
# 3. Apply a fix so the pod gets scheduled and reaches the Running state.
#
# Hint:
# Inspect the events and scheduling decisions using kubectl describe.
# ==============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: round-4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-batch
  namespace: round-4
  labels:
    app: reports-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports-batch
  template:
    metadata:
      labels:
        app: reports-batch
    spec:
      containers:
        - name: reports-batch
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Batch report generation started..."
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: "64"
              memory: "256Mi"
