---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: round-2
  labels:
    app: orders-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-worker
  template:
    metadata:
      labels:
        app: orders-worker
    spec:
      containers:
        - name: orders-worker
          image: busybox:1.36.1
          env:
            - name: DB_HOST
              value: "postgres.internal.svc.cluster.local"
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "$DB_HOST" ]; then
                echo "FATAL: DB_HOST environment variable is not set. Exiting." >&2
                exit 1
              fi
              echo "Connected to database at $DB_HOST. Processing queue..."
              while true; do sleep 3600; done
