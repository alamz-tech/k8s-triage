---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: round-1
  labels:
    app: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: nginx:1.27.0-alpine
          ports:
            - containerPort: 80
