name: Take-Home Assignment Submission (Rounds 4 & 5)
description: Submit your diagnosis, explanation, and verification screenshot for Round 4 or Round 5.
title: "[Submission]: <Your Name> - <Round 4 / Round 5>"
labels: ["submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### DevFest Abuja 2026: Masterclass Submission
        Thanks for taking on the debugging challenge! Fill out this form with your diagnosis and verification screenshot.
        
        **Privacy Note:** To protect your privacy against web scrapers, do NOT post your personal email address or phone number in this public issue. Once your submission is reviewed and approved, you will receive instructions directly in this issue thread to claim your **Career Accelerator WhatsApp Group** invite privately.

  - type: input
    id: name
    attributes:
      label: Your Full Name
      description: Enter your name or preferred handle.
      placeholder: e.g., Jane Doe
    validations:
      required: true

  - type: input
    id: linkedin
    attributes:
      label: LinkedIn Profile URL (Optional)
      description: Include your LinkedIn profile if you would like to connect.
      placeholder: https://linkedin.com/in/your-profile
    validations:
      required: false

  - type: dropdown
    id: round
    attributes:
      label: Which Round Are You Submitting?
      options:
        - "Round 4: reports-batch (Scheduling Layer)"
        - "Round 5: image-resizer (Resources Layer)"
        - "Both Rounds (Round 4 and Round 5)"
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Identified Failure Layer
      options:
        - "Scheduling Layer"
        - "Resources / Linux Cgroups Layer"
        - "Image / Registry Layer"
        - "Container / Runtime Layer"
        - "Networking / Health Probe Layer"
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: One-Sentence Explanation of Cause and Fix
      description: Name the root cause you found and the exact YAML change you made to resolve the issue.
      placeholder: "Example: The pod was stuck in Pending because CPU requests (64 cores) exceeded node capacity; I fixed it by changing requests.cpu to 100m."
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot Proof (with Terminal Watermark)
      description: "To verify authenticity, your screenshot MUST show you running: echo "Verified by @<your-github-username>" && kubectl get pods -n <namespace> so your GitHub handle appears directly above the healthy 1/1 Running pods."
      placeholder: "[Drag and drop your terminal screenshot showing your username watermark and 1/1 Running pods]"
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: Confirmation
      options:
        - label: I verified that the pod reached Running status and 1/1 Ready on my cluster or Killercoda.
          required: true
        - label: My terminal screenshot includes my GitHub handle watermark (echo "Verified by @<username>").
          required: true
        - label: I understand that incorrect answers with clear reasoning will still receive full feedback.
          required: true
