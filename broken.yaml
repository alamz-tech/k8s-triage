---
apiVersion: v1
kind: Namespace
metadata:
  name: round-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: round-1
  labels:
    app: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: nginx:1.27.0-alpin
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Namespace
metadata:
  name: round-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: round-2
  labels:
    app: orders-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-worker
  template:
    metadata:
      labels:
        app: orders-worker
    spec:
      containers:
        - name: orders-worker
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "" ]; then
                echo "FATAL: DB_HOST environment variable is not set. Exiting." >&2
                exit 1
              fi
              echo "Connected to database at . Processing queue..."
              while true; do sleep 3600; done
---
apiVersion: v1
kind: Namespace
metadata:
  name: round-3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-web
  namespace: round-3
  labels:
    app: reports-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports-web
  template:
    metadata:
      labels:
        app: reports-web
    spec:
      containers:
        - name: reports-web
          image: nginx:1.27.0-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reports-web
  namespace: round-3
  labels:
    app: reports-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: reports-web
